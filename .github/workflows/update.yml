name: Update Pages Documentation

on:
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate state controllers
        run: python merge_sctrl.py

      - name: Generate triggers
        run: python merge_triggers.py

      - name: Generate redirections
        run: python merge_redirections.py

      - name: Validate generated documentation
        run: python validate_docs.py

      - name: Check for content changes (excluding index.md)
        id: check
        run: |
          if git status --porcelain docs/ | grep -v "docs/index.md" | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update index page with timestamp
        if: steps.check.outputs.changed == 'true'
        run: |
          sed "s/TIMESTAMP_PLACEHOLDER/$(date -u +'%Y-%m-%d %H:%M:%S UTC')/g" static/index_template.md > docs/index.md

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git commit -m "docs: auto-update Pages [skip ci]"
          git push
